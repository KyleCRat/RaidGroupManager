std = "wow"
# Embedded libraries are linted from their own repository roots.
# Release notes are generated and validated during release preparation.
exclude = ["Libs/**", "Changelog/ReleaseNotes.lua"]

[lints]
global_usage = "allow"
multiple_statements = "deny"

[config]
multiple_statements = { one_line_if = "allow" }
shadowing = { ignore_pattern = "^(self$|_)" }
